name: Exclure une IP des statistiques

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "Adresse IP à exclure"
        required: true
        type: string

jobs:
  exclure:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Renseigner FLEORA_IPS_EXCLUES
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            PHP=/opt/alt/php83/usr/bin/php

            cp .env ".env.sauvegarde-$(date +%Y%m%d-%H%M%S)"

            if grep -qE '^FLEORA_IPS_EXCLUES=' .env; then
              sed -i 's/^FLEORA_IPS_EXCLUES=.*/FLEORA_IPS_EXCLUES=${{ inputs.ip }}/' .env
            else
              printf '\n# Adresses exclues des statistiques (voir .env.example).\nFLEORA_IPS_EXCLUES=${{ inputs.ip }}\n' >> .env
            fi

            grep -n '^FLEORA_IPS_EXCLUES' .env

            $PHP artisan config:clear >/dev/null
            $PHP artisan config:cache >/dev/null
            $PHP artisan view:clear >/dev/null
            echo "caches reconstruits"

            echo "--- l'application voit-elle la liste ? ---"
            $PHP -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              print_r(config("fleora.ips_exclues"));
            '

name: Activer Google Analytics

on:
  workflow_dispatch:

jobs:
  activer:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Renseigner GOOGLE_ANALYTICS_ID
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            PHP=/opt/alt/php83/usr/bin/php

            cp .env ".env.sauvegarde-$(date +%Y%m%d-%H%M%S)"

            if grep -qE '^GOOGLE_ANALYTICS_ID=' .env; then
              sed -i 's/^GOOGLE_ANALYTICS_ID=.*/GOOGLE_ANALYTICS_ID=G-YGRQL7911Q/' .env
              echo "valeur mise à jour"
            else
              printf '\n# Google Analytics 4 (voir .env.example).\nGOOGLE_ANALYTICS_ID=G-YGRQL7911Q\n' >> .env
              echo "variable ajoutée"
            fi

            grep -n '^GOOGLE_ANALYTICS_ID' .env

            # Le .env est mis en cache : sans reconstruction, la valeur reste
            # invisible pour l'application.
            $PHP artisan config:clear >/dev/null
            $PHP artisan config:cache >/dev/null
            $PHP artisan view:clear >/dev/null
            echo "caches reconstruits"

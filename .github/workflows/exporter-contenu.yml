name: Exporter le contenu de production

on:
  workflow_dispatch:

jobs:
  exporter:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Produire l'archive sur le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            rm -rf storage/app/exports
            /opt/alt/php83/usr/bin/php artisan fleora:exporter-contenu
            mv "$(ls -t storage/app/exports/*.zip | head -1)" "$HOME/contenu-production.zip"
            ls -lh "$HOME/contenu-production.zip"

      # appleboy/scp-action envoie vers le serveur ; pour rapatrier, on passe
      # par scp directement.
      - name: Télécharger l'archive
        run: |
          mkdir -p archive
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY }}" > cle
          chmod 600 cle
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i cle -P "${{ secrets.HOSTINGER_PORT }}" \
              "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:contenu-production.zip" \
              archive/contenu-production.zip
          rm -f cle
          ls -lh archive/

      - name: Publier en artéfact
        uses: actions/upload-artifact@v4
        with:
          name: contenu-production
          path: archive/contenu-production.zip
          retention-days: 2

      - name: Nettoyer le serveur
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            rm -f "$HOME/contenu-production.zip"
            rm -rf "${{ secrets.HOSTINGER_PATH }}/storage/app/exports"
            echo "archive retirée du serveur"

name: Exporter le contenu de production

on:
  workflow_dispatch:

jobs:
  exporter:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Produire l'archive
        id: export
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            rm -rf storage/app/exports
            /opt/alt/php83/usr/bin/php artisan fleora:exporter-contenu
            # Nom fixe : le glob de scp-action ne résout pas un chemin relatif,
            # et un horodatage obligerait à faire transiter le nom entre deux
            # étapes.
            mv "$(ls -t storage/app/exports/*.zip | head -1)" "$HOME/contenu-production.zip"
            ls -lh "$HOME/contenu-production.zip"

      - name: Récupérer l'archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: "contenu-production.zip"
          target: "archive"

      - name: Vérifier
        run: ls -lhR archive/

      - name: Publier en artéfact
        uses: actions/upload-artifact@v4
        with:
          name: contenu-production
          path: archive/**/*.zip
          retention-days: 2

      - name: Nettoyer le serveur
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            rm -f "$HOME/contenu-production.zip"
            rm -rf "${{ secrets.HOSTINGER_PATH }}/storage/app/exports"
            echo "archive retirée du serveur"

name: Nettoyer les visites

on:
  workflow_dispatch:
    inputs:
      essai:
        description: "Mode essai (ne supprime rien)"
        type: boolean
        default: true

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Analyser et nettoyer
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            PHP=/opt/alt/php83/usr/bin/php

            if [ "${{ inputs.essai }}" = "true" ]; then
              $PHP artisan fleora:nettoyer-visites --essai
            else
              $PHP artisan fleora:sauvegarder
              $PHP artisan fleora:nettoyer-visites --no-interaction
            fi

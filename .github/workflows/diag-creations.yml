name: Diagnostic créations

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Inventaire des créations et de leurs photos
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "${{ secrets.HOSTINGER_PATH }}"
            /opt/alt/php83/usr/bin/php -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              foreach (App\Models\Creation::withCount("media")->orderBy("id")->get() as $c) {
                printf("#%-3d %-34s publie=%-5s photos=%d%s",
                  $c->id, $c->slug_fr, var_export((bool)$c->publie, true),
                  $c->media_count, PHP_EOL);
              }
              printf("%stotal media (toutes entites) : %d%s", PHP_EOL, App\Models\Media::count(), PHP_EOL);
              printf("occasions : %d | types : %d | temoignages : %d%s",
                App\Models\Occasion::count(), App\Models\ProductType::count(),
                App\Models\Testimonial::count(), PHP_EOL);
            '
            echo "--- poids du dossier des photos ---"
            du -sh storage/app/public 2>/dev/null || echo "(absent)"
            find storage/app/public -type f 2>/dev/null | wc -l | xargs echo "fichiers :"

name: Diagnostic journaux production

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Pourquoi aucun fichier récent ?
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "${{ secrets.HOSTINGER_PATH }}"
            PHP=/opt/alt/php83/usr/bin/php

            echo "--- configuration effective ---"
            $PHP -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              printf("canal par defaut : %s\n", config("logging.default"));
              printf("stack -> %s\n", implode(",", config("logging.channels.stack.channels")));
              printf("niveau : %s\n", config("logging.channels.daily.level"));
              printf("APP_DEBUG : %s\n", var_export(config("app.debug"), true));
            '

            echo
            echo "--- ecriture de test ---"
            $PHP -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              Log::error("Essai de rotation depuis la production");
              echo "ligne ecrite", PHP_EOL;
            '

            echo
            echo "--- fichiers apres ecriture ---"
            ls -lh storage/logs/*.log | tail -4

            echo
            echo "--- droits du dossier ---"
            ls -ld storage/logs

name: Vérifier les colonnes cta

on:
  workflow_dispatch:

jobs:
  verif:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Colonnes présentes ?
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "${{ secrets.HOSTINGER_PATH }}"
            /opt/alt/php83/usr/bin/php -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              foreach (["cta_fr","cta_en","icone","meta_title_fr","contenu_seo_fr"] as $c) {
                printf("%-22s %s\n", $c,
                  Schema::hasColumn("occasions", $c) ? "présente" : "ABSENTE");
              }
              printf("\noccasions en base : %d\n", App\Models\Occasion::count());
            '

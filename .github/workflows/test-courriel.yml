name: Test courriel

on:
  workflow_dispatch:
    inputs:
      destinataire:
        description: "Adresse de test"
        required: true
        type: string

jobs:
  tester:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Envoyer depuis la production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            PHP=/opt/alt/php83/usr/bin/php
            $PHP artisan fleora:tester-courriel "${{ inputs.destinataire }}" --gabarits
            $PHP artisan queue:work --stop-when-empty --max-time=60 2>&1 | tail -15

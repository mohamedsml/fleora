name: Archiver l'ancien journal

on:
  workflow_dispatch:

jobs:
  archiver:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Basculer laravel.log vers un fichier daté
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}/storage/logs"

            if [ ! -f laravel.log ]; then
              echo "aucun laravel.log à archiver"
              exit 0
            fi

            # Renommé plutôt que supprimé : il contient l'historique des
            # erreurs déjà survenues, et le lecteur saura l'ouvrir comme les
            # autres fichiers datés.
            mv laravel.log "laravel-$(date -r laravel.log +%Y-%m-%d 2>/dev/null || date +%Y-%m-%d).log"

            echo "--- fichiers présents ---"
            ls -lh *.log

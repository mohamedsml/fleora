name: Vérifier GOOGLE_ANALYTICS_ID en production

on:
  workflow_dispatch:

jobs:
  verif:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Lire la variable sur le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "${{ secrets.HOSTINGER_PATH }}"
            echo "--- ligne du .env ---"
            grep -n '^GOOGLE_ANALYTICS_ID' .env || echo "ABSENTE"
            echo "--- valeur vue par l'application (config en cache) ---"
            /opt/alt/php83/usr/bin/php -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $id = config("services.google_analytics.id");
              echo $id ? "config : {$id}" : "config : VIDE";
              echo PHP_EOL;
            '

name: Charger le contenu initial

# Manuel et jetable : à supprimer une fois le contenu en place.
on:
  workflow_dispatch:

jobs:
  charger:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Sauvegarder puis semer
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_PATH }}"
            PHP=/opt/alt/php83/usr/bin/php

            echo "▸ Sauvegarde de la base avant écriture…"
            $PHP artisan fleora:sauvegarder

            echo "▸ Contenu initial…"
            $PHP artisan db:seed --class=ProductionSeeder --force

            echo "▸ Traductions anglaises…"
            $PHP artisan db:seed --class=TraductionsSeeder --force

            echo "▸ Sitemap…"
            $PHP artisan fleora:sitemap

            echo "▸ État final"
            $PHP -r '
              require "vendor/autoload.php"; $a = require "bootstrap/app.php";
              $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              printf("occasions publiees : %d\n", App\Models\Occasion::where("publie",true)->count());
              printf("types publies      : %d\n", App\Models\ProductType::where("publie",true)->count());
              printf("faqs publiees      : %d\n", App\Models\Faq::where("publie",true)->count());
              printf("faqs traduites     : %d\n", App\Models\Faq::whereNotNull("question_en")->count());
              printf("creations totales  : %d\n", App\Models\Creation::count());
              printf("creations publiees : %d\n", App\Models\Creation::where("publie",true)->count());
              printf("instagram          : %s\n", App\Models\SiteSetting::lire("instagram"));
              printf("utilisateurs       : %d\n", App\Models\User::count());
            '

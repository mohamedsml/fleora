name: Diagnostic chemin Hostinger

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Tester HOSTINGER_PATH sans le révéler
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          envs: CHEMIN
          script: |
            # La valeur passe par une variable d'environnement : elle n'est
            # jamais interpolée dans le script, donc jamais imprimée.
            echo "longueur du chemin : ${#CHEMIN}"
            echo "commence par un / : $(case "$CHEMIN" in /*) echo oui;; *) echo non;; esac)"
            echo "finit par un espace ou retour : $(case "$CHEMIN" in *' '|*$'\r'|*$'\n') echo OUI-PROBLEME;; *) echo non;; esac)"
            echo "octets non imprimables : $(printf '%s' "$CHEMIN" | tr -d '[:print:]' | wc -c)"
            if [ -d "$CHEMIN" ]; then
              echo "RESULTAT : le dossier existe"
            else
              echo "RESULTAT : dossier introuvable"
              echo "attendu   : domains/fleora.ca/fleora"
              echo "existe-t-il ? $([ -d "$HOME/domains/fleora.ca/fleora" ] && echo oui || echo non)"
            fi
        env:
          CHEMIN: ${{ secrets.HOSTINGER_PATH }}

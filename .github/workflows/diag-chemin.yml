name: Diagnostic chemin Hostinger

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Renseigner les réglages de session
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/domains/fleora.ca/fleora"

            echo "--- lignes SESSION_ actuelles ---"
            grep -n '^SESSION_' .env || echo "(aucune)"

            # Sauvegarde horodatée avant toute écriture dans le .env.
            cp .env ".env.sauvegarde-$(date +%Y%m%d-%H%M%S)"

            # Le site est servi en HTTPS : le cookie de session ne doit jamais
            # circuler en clair. deploy.sh refuse de déployer sans ce réglage.
            if grep -qE '^SESSION_SECURE_COOKIE=' .env; then
              sed -i 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=true/' .env
              echo "SESSION_SECURE_COOKIE : valeur corrigée"
            else
              printf '\nSESSION_SECURE_COOKIE=true\n' >> .env
              echo "SESSION_SECURE_COOKIE : ajouté"
            fi

            if grep -qE '^SESSION_SAME_SITE=' .env; then
              echo "SESSION_SAME_SITE : déjà présent"
            else
              printf 'SESSION_SAME_SITE=lax\n' >> .env
              echo "SESSION_SAME_SITE : ajouté"
            fi

            echo "--- résultat ---"
            grep -n '^SESSION_' .env

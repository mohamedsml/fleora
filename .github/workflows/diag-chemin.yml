name: Diagnostic sitemap

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Générer le sitemap et lire l'erreur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "$HOME/domains/fleora.ca/fleora"
            PHP=/opt/alt/php83/usr/bin/php
            echo "--- commande enregistrée ? ---"
            $PHP artisan list 2>&1 | grep -i "fleora" || echo "(aucune commande fleora)"
            echo "--- exécution ---"
            $PHP artisan fleora:sitemap 2>&1 | tail -20
            echo "--- fichier produit ? ---"
            ls -l public/sitemap.xml 2>&1
            echo "--- droits du dossier public ---"
            ls -ld public

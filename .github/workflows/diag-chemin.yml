name: Diagnostic chemin Hostinger

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Vérifier le dossier cible
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "$HOME/domains/fleora.ca/fleora"
            echo "--- origine git ---"
            git remote get-url origin 2>&1
            echo "--- commit actuel ---"
            git log --oneline -1 2>&1
            echo "--- branche ---"
            git rev-parse --abbrev-ref HEAD 2>&1
            echo "--- fichiers clés ---"
            for f in artisan deploy/deploy.sh .env public/index.php; do
              [ -e "$f" ] && echo "présent : $f" || echo "ABSENT  : $f"
            done
            echo "--- .env : garde-fous du script ---"
            grep -qiE '^SESSION_SECURE_COOKIE=(true|1)' .env && echo "SESSION_SECURE_COOKIE=true : OK" || echo "SESSION_SECURE_COOKIE : MANQUANT (deploy.sh refusera)"
            grep -qE '^TURNSTILE_SECRET_KEY=.+' .env && echo "TURNSTILE_SECRET_KEY : renseigné" || echo "TURNSTILE_SECRET_KEY : absent (avertissement seulement)"
            echo "--- symlink public_html ---"
            ls -ld "$HOME/domains/fleora.ca/public_html" 2>&1

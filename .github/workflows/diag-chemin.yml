name: Diagnostic contenu

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Compter le contenu publié
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd "$HOME/domains/fleora.ca/fleora"
            PHP=/opt/alt/php83/usr/bin/php
            $PHP artisan tinker --execute='
              echo "creations total   : ".\App\Models\Creation::count().PHP_EOL;
              echo "creations publiees: ".\App\Models\Creation::where("publie",true)->count().PHP_EOL;
              echo "occasions total   : ".\App\Models\Occasion::count().PHP_EOL;
              echo "occasions publiees: ".\App\Models\Occasion::where("publie",true)->count().PHP_EOL;
              echo "faqs              : ".\App\Models\Faq::count().PHP_EOL;
              echo "demandes          : ".\App\Models\CustomRequest::count().PHP_EOL;
              echo "visites           : ".\App\Models\Visite::count().PHP_EOL;
              echo "utilisateurs      : ".\App\Models\User::count().PHP_EOL;
            ' 2>&1 | grep -vi "psysh\|warning"

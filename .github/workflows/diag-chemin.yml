name: Diagnostic APP_URL

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment:
      name: Hostinger Fleora
    steps:
      - name: Lire et corriger APP_URL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/domains/fleora.ca/fleora"
            PHP=/opt/alt/php83/usr/bin/php

            echo "--- avant ---"
            grep -nE '^(APP_URL|APP_ENV|APP_DEBUG|ASSET_URL)=' .env

            cp .env ".env.sauvegarde-$(date +%Y%m%d-%H%M%S)"

            # APP_URL sert à tout ce qui est généré hors requête HTTP : les
            # URL du sitemap et les liens des courriels. Sur localhost, le
            # sitemap est inexploitable par Google et les liens des courriels
            # de confirmation pointent dans le vide.
            sed -i 's|^APP_URL=.*|APP_URL=https://fleora.ca|' .env

            echo "--- après ---"
            grep -nE '^(APP_URL|APP_ENV|APP_DEBUG)=' .env

            echo "--- reconstruction des caches ---"
            $PHP artisan config:clear >/dev/null
            $PHP artisan config:cache >/dev/null
            $PHP artisan route:cache >/dev/null
            echo "caches reconstruits"

            echo "--- régénération du sitemap ---"
            $PHP artisan fleora:sitemap 2>&1 | tail -3
            echo "--- premières URL ---"
            grep -oE '<loc>[^<]+</loc>' public/sitemap.xml | head -4

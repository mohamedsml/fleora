name: Vérifier l'exclusion

on:
  workflow_dispatch:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      # Le runner GitHub a une autre IP : il représente un visiteur normal.
      - name: Le tag se charge-t-il pour un visiteur ordinaire ?
        run: |
          echo "IP du runner : $(curl -s https://api.ipify.org)"
          N=$(curl -s "https://fleora.ca/?t=$(date +%s)" | grep -c "googletagmanager" || true)
          echo "occurrences du tag : $N"
          if [ "$N" -gt 0 ]; then
            echo "✓ les visiteurs ordinaires sont bien mesurés"
          else
            echo "::error::le tag ne se charge pour personne — la mesure est cassée"
            exit 1
          fi
